<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>广东醒狮文创 · 商店原型</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; margin: 0; padding: 0; }
body {
  --red: #E31E15; --coral: #F36F59; --gold: #D9A441;
  --gray: #AAAAAA; --slate: #94A3B8; --bg: #F5F5F5; --white: #FFFFFF;
  font-family: 'MiSans Latin','PingFang SC','Microsoft YaHei',sans-serif;
  background: #333; margin: 0; padding: 0; display: block;
}
.phone {
  width: 375px; height: 812px; background: var(--white);
  position: relative; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,.4); margin: 0 auto;
}
.status-bar {
  height: 44px; display: flex; align-items: center; padding: 0 14px;
  font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; color: #333;
  flex-shrink: 0; position: relative; z-index: 30; background: var(--white);
}
.shop-header {
  display: flex; align-items: center; padding: 0 20px; height: 56px;
  flex-shrink: 0; gap: 12px;
}
.shop-header .shop-title { font-size: 20px; font-weight: 700; color: #000; }
.shop-header .btn-search {
  margin-left: auto; width: 36px; height: 36px; border-radius: 8px;
  border: 2px solid #D9D9D9; background: none; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #AAAAAA; flex-shrink: 0;
}
.search-bar {
  display: none; padding: 0 20px 10px; flex-shrink: 0;
}
.search-bar.show { display: block; }
.search-input {
  width: 100%; height: 40px; border-radius: 8px; border: 2px solid #D9D9D9;
  padding: 0 36px 0 12px; font-size: 14px; font-family: inherit; outline: none;
  background: #F5F5F5;
}
.search-input:focus { border-color: var(--red); }
.search-clear {
  position: absolute; right: 28px; top: 50%; transform: translateY(-50%);
  background: none; border: none; font-size: 16px; cursor: pointer; color: #AAAAAA;
}
.search-wrap { position: relative; }

.category-tabs {
  display: flex; gap: 12px; padding: 0 20px 12px; flex-shrink: 0;
  overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #D9D9D9;
}
.category-tabs::-webkit-scrollbar { display: none; }
.cat-tab {
  font-size: 14px; font-weight: 500; color: #AAAAAA; cursor: pointer;
  white-space: nowrap; padding-bottom: 8px; border-bottom: 3px solid transparent;
  transition: color .2s, border-color .2s;
  position: relative; top: 1px;
}
.cat-tab.active { color: var(--red); font-weight: 700; border-bottom-color: var(--red); }

.product-scroll {
  flex: 1; overflow-y: auto; padding: 15px 20px;
  display: flex; flex-wrap: wrap; gap: 15px; align-content: flex-start;
}
.product-scroll::-webkit-scrollbar { display: none; }

.product-card {
  width: calc(50% - 7.5px); background: var(--white); border-radius: 16px;
  overflow: hidden; cursor: pointer;
  transition: transform .15s; display: flex; flex-direction: column;
}
.product-card:active { transform: scale(.97); }
.card-img {
  width: 100%; height: 191px; display: flex; align-items: center;
  justify-content: center; font-size: 56px; position: relative;
}
.card-img.fire { background: #FFF0EF; }
.card-img.water { background: #EEF8FC; }
.card-img.gold { background: #FFF8E7; }
.card-img.wood { background: #EEFAEF; }
.card-img.earth { background: #F5F0EB; }
.card-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.card-series {
  font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px;
  display: inline-block; width: fit-content;
}
.series-fire { background: #FFF0EF; color: var(--red); }
.series-water { background: #EEF8FC; color: #5AB8E8; }
.series-gold { background: #FFF8E7; color: #D9A441; }
.series-wood { background: #EEFAEF; color: #65B96A; }
.series-earth { background: #F5F0EB; color: #9A6A3E; }
.card-name { font-size: 14px; font-weight: 600; color: #000; }
.card-desc { font-size: 12px; color: #7d7d7d; line-height: 1.4; }
.card-price-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.card-price { font-size: 16px; font-weight: 700; color: var(--red); }
.card-sold { font-size: 11px; color: #AAAAAA; }

.bottom-nav {
  height: 66px; display: flex; align-items: center; justify-content: space-around;
  flex-shrink: 0; background: var(--white);
}
.nav-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; padding: 8px 16px;
}
.nav-item .ni-icon { font-size: 22px; }
.nav-item .ni-label { font-size: 12px; font-weight: 500; font-family: Inter, sans-serif; color: #AAAAAA; }
.nav-item.active .ni-label { color: var(--red); font-weight: 600; }

.toast {
  position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,.78); color: var(--white); padding: 10px 24px; border-radius: 20px;
  font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity .25s, transform .25s;
  z-index: 30; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="phone" id="app">
<div class="status-bar">9:41</div>
<div class="toast" id="toast"></div>

<!-- Store Hero Card -->
<div class="store-hero" style="margin:0 20px;height:142px;background:linear-gradient(90deg,#E31E15 0%,#F4725C 100%);border-radius:16px;position:relative;overflow:hidden;flex-shrink:0;">
  <div style="position:absolute;top:13px;left:17px;font-family:DIN,sans-serif;font-size:38px;font-weight:700;color:#fff;">Hello</div>
  <div style="position:absolute;top:11px;left:121.71px;font-family:DIN,sans-serif;font-size:38px;font-weight:700;color:#fff;">!</div>
  <div style="position:absolute;top:48px;left:17px;font-family:'MiSans Latin',sans-serif;font-size:30px;font-weight:700;color:#fff;">小狮子</div>
  <div style="position:absolute;top:96px;left:17px;height:31px;width:159px;background:#fff;border-radius:8px;display:flex;align-items:center;padding:0 10px;cursor:pointer;">
    <span style="font-size:12px;font-weight:600;color:#000;">快来挑选你喜欢的狮子吧</span>
  </div>
  <div style="position:absolute;top:11px;right:40px;width:90px;height:69px;display:grid;grid-template-columns:repeat(5,10px);gap:10px;opacity:.3;">
    <div style="width:10px;height:10px;background:#D9D9D9;border-radius:2px;"></div><div style="width:10px;height:10px;background:#D9D9D9;border-radius:2px;"></div><div style="width:10px;height:10px;background:#D9D9D9;border-radius:2px;"></div><div style="width:10px;height:10px;background:#D9D9D9;border-radius:2px;"></div><div style="width:10px;height:10px;background:#D9D9D9;border-radius:2px;"></div>
  </div>
</div>

<div class="shop-header">
  <span class="shop-title">🛒 商店</span>
  <button class="btn-search" id="btn-search" onclick="toggleSearch()">🔍</button>
</div>
<div class="search-bar" id="search-bar">
  <div class="search-wrap">
    <input class="search-input" id="search-input" placeholder="搜索商品..." oninput="filterProducts()">
    <button class="search-clear" id="search-clear" onclick="clearSearch()" style="display:none;">✕</button>
  </div>
</div>

<div class="category-tabs" id="category-tabs">
  <div class="cat-tab active" data-cat="all" onclick="selectCategory('all',this)">全部</div>
  <div class="cat-tab" data-cat="figures" onclick="selectCategory('figures',this)">小狮公仔</div>
  <div class="cat-tab" data-cat="peripherals" onclick="selectCategory('peripherals',this)">周边</div>
</div>

<div class="product-scroll" id="product-grid"></div>

<div class="bottom-nav">
  <div class="nav-item" onclick="goHome()"><span class="ni-icon">🏠</span><span class="ni-label">首页</span></div>
  <div class="nav-item active"><span class="ni-icon">🛒</span><span class="ni-label">商店</span></div>
  <div class="nav-item" onclick="showToast('个人中心')"><span class="ni-icon">👤</span><span class="ni-label">我的</span></div>
</div>
</div>

<script>
const products = [
  { id:'fire', icon:'🔥', name:'火火狮公仔', series:'火火狮系列', desc:'活泼好动的小狮，敲鼓他最在行！', price:'¥99', sold:286, cat:'figures', imgClass:'fire', seriesClass:'series-fire' },
  { id:'water', icon:'💧', name:'水水狮公仔', series:'水水狮系列', desc:'温和又稳重的小狮，最喜欢拍照。', price:'¥99', sold:178, cat:'figures', imgClass:'water', seriesClass:'series-water' },
  { id:'gold', icon:'⭐', name:'金金狮公仔', series:'金金狮系列', desc:'闪闪发光的小明星，涂色冠军！', price:'¥109', sold:153, cat:'figures', imgClass:'gold', seriesClass:'series-gold' },
  { id:'wood', icon:'🌿', name:'木木狮公仔', series:'木木狮系列', desc:'沉稳坚毅的森林伙伴，高分达人。', price:'¥99', sold:97, cat:'figures', imgClass:'wood', seriesClass:'series-wood' },
  { id:'earth', icon:'🟤', name:'土土狮公仔', series:'土土狮系列', desc:'憨厚可靠的大个子，收集齐才能找到他！', price:'¥129', sold:62, cat:'figures', imgClass:'earth', seriesClass:'series-earth' },
  { id:'keychain-fire', icon:'🔥', name:'火火狮钥匙扣', series:'小狮周边', desc:'随身携带的火火狮，挂在书包超可爱！', price:'¥29', sold:412, cat:'peripherals', imgClass:'fire', seriesClass:'series-fire' },
  { id:'sticker-pack', icon:'🎨', name:'五行小狮贴纸包', series:'小狮周边', desc:'五只小狮全套贴纸，贴满你的小世界！', price:'¥19', sold:531, cat:'peripherals', imgClass:'gold', seriesClass:'series-gold' },
  { id:'badge-fire', icon:'🏅', name:'火火狮徽章', series:'小狮周边', desc:'精美的火火狮珐琅徽章，别在衣服上吧！', price:'¥39', sold:204, cat:'peripherals', imgClass:'fire', seriesClass:'series-fire' },
];
let currentCat = 'all';

function buildGrid() {
  const filtered = currentCat === 'all' ? products : products.filter(p => p.cat === currentCat);
  document.getElementById('product-grid').innerHTML = filtered.map(p =>
    `<div class="product-card" onclick="showToast('跳转「${p.name}」商品详情')">
      <div class="card-img ${p.imgClass}">${p.icon}</div>
      <div class="card-body">
        <span class="card-series ${p.seriesClass}">${p.series}</span>
        <span class="card-name">${p.name}</span>
        <span class="card-desc">${p.desc}</span>
        <div class="card-price-row"><span class="card-price">${p.price}</span><span class="card-sold">已售 ${p.sold}+</span></div>
      </div>
    </div>`
  ).join('');
}
function selectCategory(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  buildGrid();
}
function toggleSearch() {
  const bar = document.getElementById('search-bar');
  bar.classList.toggle('show');
  if (bar.classList.contains('show')) setTimeout(() => document.getElementById('search-input').focus(), 100);
  else clearSearch();
}
function filterProducts() {
  const q = document.getElementById('search-input').value.toLowerCase();
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  const filtered = (currentCat === 'all' ? products : products.filter(p => p.cat === currentCat))
    .filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
  document.getElementById('product-grid').innerHTML = filtered.length
    ? filtered.map(p =>
      `<div class="product-card" onclick="showToast('跳转「${p.name}」商品详情')">
        <div class="card-img ${p.imgClass}">${p.icon}</div>
        <div class="card-body">
          <span class="card-series ${p.seriesClass}">${p.series}</span>
          <span class="card-name">${p.name}</span>
          <span class="card-desc">${p.desc}</span>
          <div class="card-price-row"><span class="card-price">${p.price}</span><span class="card-sold">已售 ${p.sold}+</span></div>
        </div>
      </div>`
    ).join('')
    : '<div style="text-align:center;padding:40px;color:#AAAAAA;font-size:14px;">未找到相关商品</div>';
}
function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  buildGrid();
}
function goHome() { window.location.href = 'v2_敲鼓玩法_低保真.html'; }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
buildGrid();
</script>
</body>
</html>
