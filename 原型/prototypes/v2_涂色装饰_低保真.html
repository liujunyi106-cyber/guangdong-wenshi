<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>广东醒狮文创 · 涂色装饰原型</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; margin: 0; padding: 0; }
body {
  --red: #E31E15; --coral: #F36F59; --gold: #D9A441;
  --gray: #AAAAAA; --slate: #94A3B8; --bg: #F5F5F5; --white: #FFFFFF;
  font-family: 'MiSans Latin','PingFang SC','Microsoft YaHei',sans-serif;
  background: #333; margin: 0; padding: 0;
}
.phone {
  width: 375px; height: 812px; background: var(--white);
  position: relative; overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,.4); margin: 0 auto;
}
.status-bar {
  height: 44px; display: flex; align-items: center; padding: 0 14px;
  font-family: Inter, sans-serif; font-size: 14px; font-weight: 500; color: #333;
  flex-shrink: 0; position: relative; z-index: 30; background: var(--white);
}
.page-group { position: absolute; top: 44px; left: 0; width: 100%; bottom: 0; display: none; overflow-y: auto; }
.page-group.show { display: block; }
#pg-color.show { display: flex; flex-direction: column; overflow: hidden; }
#pg-template.show { display: flex; flex-direction: column; overflow: hidden; }
#pg-draw.show { display: flex; flex-direction: column; overflow: hidden; }
#pg-done-color.show { display: flex; flex-direction: column; }

.top-bar {
  display: flex; align-items: center; padding: 0 20px; height: 56px;
  flex-shrink: 0; position: relative; z-index: 5;
}
.top-bar .btn-back {
  width: 32px; height: 32px; border-radius: 8px; border: 2px solid #AAAAAA;
  background: none; font-size: 18px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; color: #AAAAAA; flex-shrink: 0;
}
.top-bar .title {
  position: absolute; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 700; color: #000;
}

/* Outline Select */
.outline-grid { display: flex; gap: 15px; margin: 18px 20px 0; }
.outline-card {
  flex: 1; height: 160px; background: #fff; border-radius: 16px; border: 2px solid #D9D9D9;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  cursor: pointer; transition: transform .15s;
}
.outline-card:active { transform: scale(.96); }
.outline-card .oc-icon { font-size: 44px; }
.outline-card .oc-name { font-size: 15px; font-weight: 600; color: #333; }
.outline-card .oc-difficulty { font-size: 12px; color: #AAAAAA; }
.outline-card .oc-blocks { display: flex; gap: 4px; margin-top: 2px; }
.outline-card .oc-blocks span { width: 8px; height: 8px; border-radius: 2px; background: #D9D9D9; }
.outline-card .oc-blocks span.filled { background: var(--coral); }
.free-draw-card {
  margin: 15px 20px 0; height: 80px; background: var(--coral); border-radius: 16px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  cursor: pointer; transition: transform .15s; color: #fff;
}
.free-draw-card:active { transform: scale(.97); }
.free-draw-card .fd-icon { font-size: 36px; }
.free-draw-card .fd-text { font-size: 18px; font-weight: 700; }

/* Editor Header */
.editor-header {
  display: flex; align-items: center; padding: 0 20px; height: 56px;
  gap: 12px; flex-shrink: 0; border-bottom: 1px solid #D9D9D9;
}
.editor-header .btn-back {
  width: 32px; height: 32px; border-radius: 8px; border: 2px solid #AAAAAA;
  background: none; font-size: 18px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; color: #AAAAAA; flex-shrink: 0;
}
.editor-tabs {
  display: flex; flex: 1; gap: 0; background: #F5F5F5; border-radius: 8px;
  overflow: hidden; position: relative;
}
.editor-tab {
  flex: 1; height: 36px; display: flex; align-items: center; justify-content: center; gap: 4px;
  font-size: 12px; font-weight: 600; color: #AAAAAA; cursor: pointer;
  transition: color .2s; position: relative; z-index: 1; border-radius: 8px;
}
.editor-tab.active { color: #fff; }
.tab-indicator {
  position: absolute; top: 0; left: 0; width: 50%; height: 100%;
  background: var(--red); border-radius: 8px;
  transition: left .25s ease; z-index: 0;
}

/* Canvas */
.canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #F5F5F5; position: relative; overflow: hidden; }
.canvas-board { width: 300px; height: 400px; background: #fff; border-radius: 16px; border: 2px solid #D9D9D9; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.canvas-board .outline-preview { font-size: 120px; opacity: .12; color: #333; }
.fill-region { position: absolute; border: 1.5px dashed #D9D9D9; border-radius: 4px; cursor: pointer; transition: background .3s; }
.fill-region:hover { border-color: var(--red); }
.fill-region.filled { border-style: solid; }

/* Bottom tools */
.bottom-tools { position: relative; flex-shrink: 0; height: 124px; background: #fff; border-top: 1px solid #D9D9D9; }

/* Palette */
.palette-bar {
  flex-shrink: 0; display: flex; gap: 10px; padding: 10px 0;
  overflow-x: auto; scrollbar-width: none;
}
.palette-bar::-webkit-scrollbar { display: none; }
.palette-bar::before, .palette-bar::after { content: ''; flex-shrink: 0; width: 20px; }
.palette-swatch {
  width: 44px; min-width: 44px; height: 44px; min-height: 44px;
  border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: transform .15s, border-color .15s;
  flex-shrink: 0; padding: 0;
}
.palette-swatch:active { transform: scale(1.15); }
.palette-swatch.active { border-color: #333; transform: scale(1.1); }

/* Actions */
.action-bar { flex-shrink: 0; display: flex; gap: 10px; padding: 0 20px 24px; }
.action-btn {
  flex: 1; height: 44px; border-radius: 8px; font-size: 14px; font-weight: 600;
  border: 2px solid #D9D9D9; background: #fff; color: #555; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.action-btn:active { background: #f0f0f0; }
.action-btn:disabled { opacity: .4; pointer-events: none; }

/* Deco */
.deco-tray {
  display: flex; gap: 12px; padding: 32px 20px; flex-shrink: 0;
  background: #fff; overflow-x: auto; align-items: center; height: 100%;
}
.deco-item {
  width: 56px; height: 56px; border-radius: 16px; background: #F5F5F5;
  border: 2px solid #D9D9D9; display: flex; align-items: center; justify-content: center;
  font-size: 28px; cursor: grab; flex-shrink: 0; transition: transform .15s;
}
.deco-item:active { transform: scale(1.1); cursor: grabbing; }
.deco-item.used { opacity: .3; pointer-events: none; }
.deco-placed {
  position: absolute; width: 48px; height: 48px; display: flex; align-items: center;
  justify-content: center; font-size: 30px; cursor: grab; user-select: none;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,.15));
}
.deco-placed.selected { outline: 2px dashed var(--gold); outline-offset: 3px; border-radius: 4px; }

/* IP Selector */
.ip-selector {
  display: flex; gap: 10px; padding: 10px 20px; flex-shrink: 0;
  background: #F5F5F5; border-bottom: 1px solid #D9D9D9; overflow-x: auto;
}
.ip-chip {
  width: 52px; height: 64px; border-radius: 16px; background: #fff;
  border: 2px solid #D9D9D9; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 4px;
  cursor: pointer; transition: transform .15s, border-color .15s;
  flex-shrink: 0; position: relative;
}
.ip-chip:active { transform: scale(.94); }
.ip-chip.active { border-color: var(--red); background: #fff5f5; }
.ip-chip.locked { border-color: #D9D9D9; background: #F5F5F5; }
.ip-chip .ip-lock { position: absolute; top: 2px; right: 4px; font-size: 10px; }
.ip-chip .ip-emoji { font-size: 24px; }
.ip-chip .ip-name { font-size: 10px; font-weight: 600; color: #888; }
.ip-chip.active .ip-name { color: var(--red); }

/* Template Draw */
#pg-template { background: #F5F5F5; }
.template-area { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.template-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
.template-overlay {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  font-size: 100px; opacity: .08; pointer-events: none; color: #333;
}

/* Free Draw */
#pg-draw { background: #fafafa; }
.draw-area { flex: 1; position: relative; overflow: hidden; touch-action: none; }
.draw-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
.draw-palette {
  display: flex; gap: 10px; padding: 10px 0;
  flex-shrink: 0; background: #fff; border-top: 1px solid #D9D9D9;
  overflow-x: auto; scrollbar-width: none;
}
.draw-palette::-webkit-scrollbar { display: none; }
.draw-palette::before, .draw-palette::after { content: ''; flex-shrink: 0; width: 20px; }
.draw-swatch {
  width: 44px; min-width: 44px; height: 44px; min-height: 44px;
  border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: transform .15s;
  flex-shrink: 0; padding: 0;
}
.draw-swatch:active { transform: scale(1.15); }
.draw-swatch.active { border-color: #333; transform: scale(1.1); }
.draw-actions { display: flex; gap: 10px; padding: 0 20px 24px; flex-shrink: 0; background: #fff; }

/* Done Page */
#pg-done-color { background: var(--white); }
#pg-done-color .top-bar .title { position: static; margin-left: 12px; transform: none; }
.done-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 50px 20px 40px; }
.done-content .done-icon { font-size: 56px; margin-bottom: 16px; animation: popIn .4s ease; }
.done-content .done-title { font-size: 20px; font-weight: 700; color: #333; margin-bottom: 20px; }
.done-preview { width: 260px; height: 340px; border-radius: 16px; border: 2px solid #D9D9D9; display: flex; align-items: center; justify-content: center; background: #F5F5F5; margin-bottom: 24px; }
.done-preview .dp-art { font-size: 100px; opacity: .15; color: #333; }
.done-btns { display: flex; gap: 12px; width: 260px; }
.done-btns button { flex: 1; height: 48px; border-radius: 8px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; }
.btn-again { background: var(--bg); color: #555; }
.btn-share { background: var(--gold); color: #fff; }

/* Confirm modal */
.confirm-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.35); z-index: 20;
  display: none; align-items: center; justify-content: center;
  pointer-events: none;
}
.confirm-overlay.show { display: flex; }
.confirm-dialog {
  pointer-events: auto;
  width: 280px; background: var(--white); border-radius: 16px;
  padding: 24px 20px; text-align: center; animation: modalIn .25s ease;
}
.confirm-dialog .cd-title { font-size: 17px; font-weight: 700; color: #333; margin-bottom: 8px; }
.confirm-dialog .cd-desc { font-size: 12px; color: #94A3B8; margin-bottom: 20px; }
.confirm-dialog .cd-btns { display: flex; gap: 10px; }
.confirm-dialog .cd-btns button { flex: 1; height: 44px; border-radius: 8px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; }
.cd-btn-cancel { background: #F5F5F5; color: #AAAAAA; }
.cd-btn-confirm { background: var(--red); color: #fff; }

/* Unlock */
.unlock-overlay {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,.35); z-index: 20;
  display: none; align-items: center; justify-content: center; flex-direction: column;
  pointer-events: none;
}
.unlock-overlay.show { display: flex; }
.unlock-dialog { pointer-events: auto; display: flex; flex-direction: column; align-items: center; }
.unlock-dialog .uo-icon { font-size: 80px; animation: bounceUnlock .6s ease infinite alternate; }
.unlock-dialog .uo-title { color: var(--white); font-size: 24px; font-weight: 700; margin: 16px 0 4px; }
.unlock-dialog .uo-sub { color: rgba(255,255,255,.7); font-size: 16px; margin-bottom: 24px; }
.unlock-dialog .uo-close { padding: 10px 36px; border-radius: 8px; background: var(--gold); border: none; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }

/* Toast */
.toast {
  position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,.78); color: var(--white); padding: 10px 24px; border-radius: 20px;
  font-size: 14px; white-space: nowrap; opacity: 0; transition: opacity .25s, transform .25s;
  z-index: 30; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes modalIn { from { transform: scale(.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
@keyframes bounceUnlock { from { transform: translateY(0); } to { transform: translateY(-12px); } }
</style>
</head>
<body>
<div class="phone" id="app">
<div class="status-bar">9:41</div>
<div class="toast" id="toast"></div>

<!-- Outline Select -->
<div class="page-group show" id="pg-outline">
  <div class="top-bar">
    <button class="btn-back" onclick="goHome()">←</button>
    <span class="title">选择线稿</span>
  </div>
  <div class="outline-grid">
    <div class="outline-card" onclick="startColor('simple')">
      <span class="oc-icon">🦁</span><span class="oc-name">简单狮头</span><span class="oc-difficulty">☆ 入门</span>
      <div class="oc-blocks"><span class="filled"></span><span class="filled"></span><span class="filled"></span><span class="filled"></span></div>
    </div>
    <div class="outline-card" onclick="startColor('standard')">
      <span class="oc-icon">🐲</span><span class="oc-name">标准狮头</span><span class="oc-difficulty">☆☆ 进阶</span>
      <div class="oc-blocks"><span class="filled"></span><span class="filled"></span><span class="filled"></span><span class="filled"></span><span class="filled"></span><span class="filled"></span><span class="filled"></span><span class="filled"></span></div>
    </div>
  </div>
  <div class="free-draw-card" onclick="startFreeDraw()">
    <span class="fd-icon">🎨</span><span class="fd-text">自由绘画</span>
  </div>
</div>

<!-- Color/Deco Editor -->
<div class="page-group" id="pg-color">
  <div class="editor-header">
    <button class="btn-back" onclick="confirmBack()">←</button>
    <div class="editor-tabs">
      <div class="tab-indicator" id="tab-indicator"></div>
      <div class="editor-tab active" id="tab-color" onclick="switchMode('color')">🎨 涂色</div>
      <div class="editor-tab" id="tab-deco" onclick="switchMode('deco')">🖌️ 装饰</div>
    </div>
  </div>
  <div class="ip-selector" id="ip-selector"></div>
  <div class="canvas-area" id="canvas-area">
    <div class="canvas-board" id="canvas-board">
      <span class="outline-preview">🔥</span>
      <div class="fill-region" style="top:30px;left:50px;width:60px;height:40px;" data-region="ear-left"></div>
      <div class="fill-region" style="top:30px;right:50px;width:60px;height:40px;" data-region="ear-right"></div>
      <div class="fill-region" style="top:80px;left:60px;width:80px;height:100px;" data-region="face-left"></div>
      <div class="fill-region" style="top:80px;right:60px;width:80px;height:100px;" data-region="face-right"></div>
      <div class="fill-region" style="top:140px;left:50%;width:80px;height:60px;transform:translateX(-50%);" data-region="nose"></div>
      <div class="fill-region" style="top:100px;left:120px;width:60px;height:30px;" data-region="eye-left"></div>
      <div class="fill-region" style="top:100px;right:120px;width:60px;height:30px;" data-region="eye-right"></div>
      <div class="fill-region" style="top:200px;left:50px;width:200px;height:80px;" data-region="beard"></div>
    </div>
  </div>
  <div class="bottom-tools">
    <div id="tools-color" style="display:flex;flex-direction:column;flex:1;">
      <div class="palette-bar" id="palette-bar"></div>
      <div class="action-bar" id="action-bar">
        <button class="action-btn" id="btn-clear" onclick="confirmClear()">🧹 清空</button>
        <button class="action-btn" id="btn-undo" onclick="undoColor()" disabled>↩️ 撤销</button>
      </div>
    </div>
    <div id="tools-deco" style="display:none;flex:1;">
      <div class="deco-tray" id="deco-tray"></div>
    </div>
  </div>
</div>

<!-- Template Draw (Standard) -->
<div class="page-group" id="pg-template">
  <div class="editor-header">
    <button class="btn-back" onclick="confirmBackTemplate()">←</button>
    <span style="flex:1;text-align:center;font-size:15px;font-weight:700;color:#333;">标准狮头</span>
  </div>
  <div class="ip-selector" id="tpl-ip-selector"></div>
  <div class="template-area" id="tpl-area">
    <canvas class="template-canvas" id="tpl-canvas"></canvas>
    <div class="template-overlay" id="tpl-overlay">🦁</div>
  </div>
  <div class="draw-palette" id="tpl-palette"></div>
  <div class="draw-actions action-bar">
    <button class="action-btn" id="tpl-clear" onclick="confirmClearTpl()">🧹 清空</button>
    <button class="action-btn" id="tpl-undo" onclick="tplUndo()" disabled>↩️ 撤销</button>
  </div>
</div>

<!-- Free Draw -->
<div class="page-group" id="pg-draw">
  <div class="editor-header">
    <button class="btn-back" onclick="confirmBackDraw()">←</button>
    <span style="flex:1;text-align:center;font-size:15px;font-weight:700;color:#333;">自由绘画</span>
  </div>
  <div class="draw-area" id="draw-area">
    <canvas class="draw-canvas" id="draw-canvas"></canvas>
  </div>
  <div class="draw-palette" id="draw-palette"></div>
  <div class="draw-actions action-bar">
    <button class="action-btn" id="draw-clear" onclick="confirmClearDraw()">🧹 清空</button>
    <button class="action-btn" id="draw-undo" onclick="drawUndo()" disabled>↩️ 撤销</button>
  </div>
</div>

<!-- Done Page -->
<div class="page-group" id="pg-done-color">
  <div class="top-bar" style="justify-content:flex-start;">
    <button class="btn-back" onclick="showPage('pg-outline')">←</button>
    <span class="title">完成啦</span>
  </div>
  <div class="done-content">
    <div class="done-icon">✅</div>
    <div class="done-title">已保存到作品集</div>
    <div class="done-preview" id="done-preview"><span class="dp-art">🦁</span></div>
    <div class="done-btns">
      <button class="btn-again" onclick="resetAndBack()">再画一张</button>
      <button class="btn-share" onclick="showToast('分享给好友啦~')">分享好友</button>
    </div>
  </div>
  <div class="unlock-overlay" id="unlock-overlay">
    <div class="unlock-dialog">
      <div class="uo-icon">⭐</div>
      <div class="uo-title">解锁金金狮！</div>
      <div class="uo-sub">完成第一幅作品，闪闪的金金狮来啦~</div>
      <button class="uo-close" onclick="closeUnlock()">太棒啦！</button>
    </div>
  </div>
</div>

<!-- Global Confirm Modal -->
<div class="confirm-overlay" id="confirm-modal">
  <div class="confirm-dialog">
    <div class="cd-title">确定清空所有颜色？</div>
    <div class="cd-desc">清空后无法恢复哦~</div>
    <div class="cd-btns">
      <button class="cd-btn-cancel" onclick="closeConfirm()">取消</button>
      <button class="cd-btn-confirm" id="btn-confirm-action">清空</button>
    </div>
  </div>
</div>

</div>

<script>
// ---- Data ----
const palette = ['#E31E15','#FF6B35','#FFB800','#F5D000','#4CAF50','#65B96A','#5AB8E8','#3B82F6','#7B68EE','#9B59B6','#E91E63','#FF4081','#333333','#888888','#FFFFFF','#8D6E63'];
const drawPalette = ['#E31E15','#FF6B35','#FFB800','#F5D000','#4CAF50','#65B96A','#5AB8E8','#3B82F6','#7B68EE','#9B59B6','#E91E63','#FF4081','#333333','#888888','#FFFFFF','#8D6E63'];
const decorations = [
  { id: 'cloud', icon: '☁️', label: '云纹' },
  { id: 'fire2', icon: '🔥', label: '火焰' },
  { id: 'star', icon: '⭐', label: '星光' },
  { id: 'flower', icon: '🌸', label: '花' },
  { id: 'bow', icon: '🎀', label: '蝴蝶结' },
];
const ipLions = [
  { id: 'fire', icon: '🔥', name: '火火狮', color: '#E31E15', unlocked: true, condition: '' },
  { id: 'water', icon: '💧', name: '水水狮', color: '#5AB8E8', unlocked: false, condition: 'AR拍照 1 次' },
  { id: 'gold', icon: '⭐', name: '金金狮', color: '#D9A441', unlocked: false, condition: '涂色完成 1 幅' },
  { id: 'wood', icon: '🌲', name: '木木狮', color: '#65B96A', unlocked: false, condition: '敲鼓 S/A 评级' },
  { id: 'earth', icon: '🟤', name: '土土狮', color: '#9A6A3E', unlocked: false, condition: '集齐前 4 只' },
];

let currentMode = 'color', selectedColor = '#E31E15', fillHistory = [], decoPlaced = [], firstSave = true, selectedIP = 'fire';
let tplCtx, tplColor = '#E31E15', tplDrawing = false, tplHistory = [], tplSelectedIP = 'fire';
let drawCtx, drawColor = '#E31E15', drawing = false, drawHistory = [];

// ---- Init ----
buildPalette(); buildDecoTray(); buildIPSelector();
document.querySelectorAll('.fill-region').forEach(r => r.addEventListener('click', () => fillRegion(r)));
document.getElementById('canvas-board').addEventListener('click', (e) => {
  if (e.target === e.currentTarget || e.target.classList.contains('fill-region'))
    document.querySelectorAll('.deco-placed').forEach(d => d.classList.remove('selected'));
});

function buildPalette() {
  document.getElementById('palette-bar').innerHTML = palette.map(c => '<div class="palette-swatch'+(c===selectedColor?' active':'')+'" style="background:'+c+';" data-color="'+c+'" onclick="pickColor(\''+c+'\',this)"></div>').join('');
}
function pickColor(color, el) { selectedColor = color; document.querySelectorAll('.palette-swatch').forEach(s => s.classList.remove('active')); el.classList.add('active'); }

function fillRegion(region) {
  if (currentMode !== 'color' || (region.classList.contains('filled') && region.style.background === selectedColor)) return;
  const prev = region.style.background || null;
  region.style.background = selectedColor; region.classList.add('filled'); region.style.borderColor = selectedColor;
  fillHistory.push({ el: region, prev, color: selectedColor }); updateUndo();
}
function undoColor() {
  if (!fillHistory.length) return; const last = fillHistory.pop();
  if (last.prev) { last.el.style.background = last.prev; last.el.style.borderColor = last.prev; }
  else { last.el.style.background = ''; last.el.classList.remove('filled'); last.el.style.borderColor = ''; }
  updateUndo();
}
function updateUndo() { document.getElementById('btn-undo').disabled = !fillHistory.length; }

function confirmClear() {
  if (!fillHistory.length) { showToast('还没有涂过颜色哦~'); return; }
  document.getElementById('confirm-modal').querySelector('.cd-title').textContent = '确定清空所有颜色？';
  document.getElementById('confirm-modal').querySelector('.cd-desc').textContent = '清空后无法恢复哦~';
  document.getElementById('btn-confirm-action').textContent = '清空';
  document.getElementById('btn-confirm-action').onclick = () => { closeConfirm(); clearAll(); };
  document.getElementById('confirm-modal').classList.add('show');
}
function closeConfirm() { document.getElementById('confirm-modal').classList.remove('show'); }
function clearAll() {
  document.querySelectorAll('.fill-region').forEach(r => { r.style.background = ''; r.classList.remove('filled'); r.style.borderColor = ''; });
  fillHistory = []; updateUndo(); showToast('已清空所有颜色~');
}

function switchMode(mode) {
  currentMode = mode;
  document.getElementById('tab-color').classList.toggle('active', mode === 'color');
  document.getElementById('tab-deco').classList.toggle('active', mode === 'deco');
  document.getElementById('tab-indicator').style.left = mode === 'color' ? '0' : '50%';
  document.getElementById('tools-color').style.display = mode === 'color' ? 'flex' : 'none';
  document.getElementById('tools-deco').style.display = mode === 'deco' ? 'flex' : 'none';
}

function buildDecoTray() {
  document.getElementById('deco-tray').innerHTML = decorations.map(d =>
    `<div class="deco-item${decoPlaced.some(p=>p.id===d.id)?' used':''}" data-id="${d.id}" onclick="placeDeco('${d.id}','${d.icon}')" title="${d.label}">${d.icon}</div>`
  ).join('');
}
function placeDeco(id, icon) {
  if (decoPlaced.find(p => p.id === id)) return;
  const board = document.getElementById('canvas-board');
  const el = document.createElement('div'); el.className = 'deco-placed'; el.textContent = icon;
  el.style.left = '120px'; el.style.top = '170px'; el.setAttribute('data-deco-id', id);
  el.addEventListener('pointerdown', (e) => startDragDeco(e, el));
  el.addEventListener('click', (e) => { e.stopPropagation(); document.querySelectorAll('.deco-placed').forEach(d => d.classList.remove('selected')); el.classList.add('selected'); });
  board.appendChild(el); decoPlaced.push({ id, icon, el }); buildDecoTray();
  document.querySelectorAll('.deco-placed').forEach(d => d.classList.remove('selected')); el.classList.add('selected');
  showToast('装饰已放置，可以拖动~');
}

let dragTarget, dragStartX, dragStartY, dragOrigLeft, dragOrigTop;
function startDragDeco(e, el) {
  e.preventDefault(); e.stopPropagation(); dragTarget = el;
  dragStartX = e.clientX; dragStartY = e.clientY;
  dragOrigLeft = parseInt(el.style.left)||0; dragOrigTop = parseInt(el.style.top)||0;
  el.setPointerCapture(e.pointerId);
  el.addEventListener('pointermove', onDragDeco); el.addEventListener('pointerup', onDropDeco);
}
function onDragDeco(e) {
  if (!dragTarget) return;
  const board = document.getElementById('canvas-board'), bw = board.clientWidth, bh = board.clientHeight;
  let nx = Math.max(0, Math.min(bw-48, dragOrigLeft + e.clientX - dragStartX));
  let ny = Math.max(0, Math.min(bh-48, dragOrigTop + e.clientY - dragStartY));
  dragTarget.style.left = nx+'px'; dragTarget.style.top = ny+'px';
  dragTarget.style.outline = (nx<15||nx>bw-63||ny<15||ny>bh-63) ? '2px solid #E31E15' : '';
}
function onDropDeco(e) {
  if (!dragTarget) return;
  const board = document.getElementById('canvas-board'), bw = board.clientWidth, bh = board.clientHeight;
  const nx = parseInt(dragTarget.style.left), ny = parseInt(dragTarget.style.top);
  dragTarget.style.outline = '';
  e.target.removeEventListener('pointermove', onDragDeco); e.target.removeEventListener('pointerup', onDropDeco);
  if (nx<15||nx>bw-63||ny<15||ny>bh-63) confirmDeleteDeco(dragTarget);
  dragTarget = null;
}
function confirmDeleteDeco(el) {
  document.getElementById('confirm-modal').querySelector('.cd-title').textContent = '要删除这个装饰吗？';
  document.getElementById('confirm-modal').querySelector('.cd-desc').textContent = '删除后可以重新添加哦~';
  document.getElementById('btn-confirm-action').textContent = '删除';
  document.getElementById('btn-confirm-action').onclick = () => { closeConfirm(); el.remove(); decoPlaced = decoPlaced.filter(p => p.el !== el); buildDecoTray(); showToast('装饰已删除~'); };
  document.getElementById('confirm-modal').classList.add('show');
}

function buildIPSelector() {
  document.getElementById('ip-selector').innerHTML = ipLions.map(ip =>
    `<div class="ip-chip${ip.id===selectedIP?' active':''}${ip.unlocked?'':' locked'}" data-ip="${ip.id}" onclick="selectIP('${ip.id}')">
      ${ip.unlocked?'':'<span class="ip-lock">🔒</span>'}<span class="ip-emoji" style="${ip.unlocked?'':'filter:grayscale(1);opacity:.4'}">${ip.icon}</span><span class="ip-name">${ip.name}</span>
    </div>`
  ).join('');
}
function selectIP(id) {
  const ip = ipLions.find(l => l.id === id);
  if (!ip.unlocked) { showToast(ip.name+'还没解锁呢~ '+ip.condition); return; }
  selectedIP = id; buildIPSelector();
  document.querySelector('#canvas-board .outline-preview').textContent = ip.icon;
  showToast('选择了'+ip.name+'~');
}

// ---- Navigation ----
function showPage(id) { document.querySelectorAll('.page-group').forEach(p => p.classList.remove('show')); document.getElementById(id).classList.add('show'); }
function goHome() { window.location.href = 'v2_敲鼓玩法_低保真.html'; }

function startColor(type) {
  if (type === 'standard') { startTemplateDraw(); return; }
  fillHistory = []; decoPlaced = []; currentMode = 'color'; updateUndo();
  document.querySelectorAll('.fill-region').forEach(r => { r.style.background = ''; r.classList.remove('filled'); r.style.borderColor = ''; });
  document.querySelectorAll('.deco-placed').forEach(d => d.remove());
  switchMode('color'); buildDecoTray(); selectedIP = 'fire'; buildIPSelector(); showPage('pg-color');
}
function confirmBack() {
  if (fillHistory.length || decoPlaced.length) {
    document.getElementById('confirm-modal').querySelector('.cd-title').textContent = '要退出吗？';
    document.getElementById('confirm-modal').querySelector('.cd-desc').textContent = '退出后未保存的内容会丢失哦~';
    document.getElementById('btn-confirm-action').textContent = '退出';
    document.getElementById('btn-confirm-action').onclick = () => { closeConfirm(); showPage('pg-outline'); };
    document.getElementById('confirm-modal').classList.add('show');
  } else showPage('pg-outline');
}
function goDone() { showPage('pg-done-color'); if (firstSave) { firstSave = false; setTimeout(() => document.getElementById('unlock-overlay').classList.add('show'), 800); } }
function closeUnlock() { document.getElementById('unlock-overlay').classList.remove('show'); }
function resetAndBack() { firstSave = true; showPage('pg-outline'); }

// ---- Template Draw ----
function startTemplateDraw() {
  showPage('pg-template'); tplSelectedIP = 'fire'; buildTplIPSelector();
  setTimeout(() => initTplCanvas(), 100);
}
function buildTplIPSelector() {
  document.getElementById('tpl-ip-selector').innerHTML = ipLions.map(ip =>
    `<div class="ip-chip${ip.id===tplSelectedIP?' active':''}${ip.unlocked?'':' locked'}" data-ip="${ip.id}" onclick="selectTplIP('${ip.id}')">
      ${ip.unlocked?'':'<span class="ip-lock">🔒</span>'}<span class="ip-emoji" style="${ip.unlocked?'':'filter:grayscale(1);opacity:.4'}">${ip.icon}</span><span class="ip-name">${ip.name}</span>
    </div>`
  ).join('');
}
function selectTplIP(id) {
  const ip = ipLions.find(l => l.id === id);
  if (!ip.unlocked) { showToast(ip.name+'还没解锁呢~ '+ip.condition); return; }
  tplSelectedIP = id; buildTplIPSelector(); document.getElementById('tpl-overlay').textContent = ip.icon;
  showToast('模板切换为'+ip.name+'~');
}
function initTplCanvas() {
  const canvas = document.getElementById('tpl-canvas');
  if (!canvas || canvas.dataset.inited) return; canvas.dataset.inited = '1';
  const area = document.getElementById('tpl-area'); canvas.width = area.clientWidth; canvas.height = area.clientHeight;
  tplCtx = canvas.getContext('2d'); tplCtx.lineCap = 'round'; tplCtx.lineJoin = 'round'; tplCtx.lineWidth = 6;
  tplCtx.fillStyle = '#FFFFFF'; tplCtx.fillRect(0, 0, canvas.width, canvas.height); saveTplState();
  canvas.addEventListener('pointerdown', (e) => { tplDrawing = true; tplCtx.beginPath(); tplCtx.moveTo(e.offsetX, e.offsetY); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!tplDrawing) return; tplCtx.strokeStyle = tplColor; tplCtx.lineTo(e.offsetX, e.offsetY); tplCtx.stroke(); });
  canvas.addEventListener('pointerup', () => { if (!tplDrawing) return; tplDrawing = false; tplCtx.closePath(); saveTplState(); updateTplUndo(); });
  buildTplPalette();
}
function buildTplPalette() {
  document.getElementById('tpl-palette').innerHTML = drawPalette.map(c => '<div class="draw-swatch'+(c===tplColor?' active':'')+'" style="background:'+c+';" data-color="'+c+'" onclick="pickTplColor(\''+c+'\',this)"></div>').join('');
}
function pickTplColor(color, el) { tplColor = color; document.querySelectorAll('#tpl-palette .draw-swatch').forEach(s => s.classList.remove('active')); el.classList.add('active'); }
function saveTplState() { const c = document.getElementById('tpl-canvas'); tplHistory.push(c.toDataURL()); if (tplHistory.length>30) tplHistory.shift(); }
function tplUndo() { if (tplHistory.length<=1) return; tplHistory.pop(); const c = document.getElementById('tpl-canvas'), img = new Image(); img.onload = () => { tplCtx.clearRect(0,0,c.width,c.height); tplCtx.drawImage(img,0,0); updateTplUndo(); }; img.src = tplHistory[tplHistory.length-1]; }
function updateTplUndo() { document.getElementById('tpl-undo').disabled = tplHistory.length<=1; }
function confirmClearTpl() {
  document.getElementById('confirm-modal').querySelector('.cd-title').textContent = '确定清空画布？';
  document.getElementById('confirm-modal').querySelector('.cd-desc').textContent = '清空后无法恢复哦~';
  document.getElementById('btn-confirm-action').textContent = '清空';
  document.getElementById('btn-confirm-action').onclick = () => { closeConfirm(); const c = document.getElementById('tpl-canvas'); tplCtx.fillStyle='#FFFFFF'; tplCtx.fillRect(0,0,c.width,c.height); tplHistory=[]; saveTplState(); updateTplUndo(); showToast('画布已清空~'); };
  document.getElementById('confirm-modal').classList.add('show');
}
function confirmBackTemplate() {
  if (tplHistory.length>1) {
    document.getElementById('confirm-modal').querySelector('.cd-title').textContent = '要退出吗？';
    document.getElementById('confirm-modal').querySelector('.cd-desc').textContent = '退出后未保存的内容会丢失哦~';
    document.getElementById('btn-confirm-action').textContent = '退出';
    document.getElementById('btn-confirm-action').onclick = () => { closeConfirm(); showPage('pg-outline'); };
    document.getElementById('confirm-modal').classList.add('show');
  } else showPage('pg-outline');
}

// ---- Free Draw ----
function startFreeDraw() { showPage('pg-draw'); setTimeout(() => initDrawCanvas(), 100); }
function initDrawCanvas() {
  const canvas = document.getElementById('draw-canvas');
  if (!canvas || canvas.dataset.inited) return; canvas.dataset.inited = '1';
  const area = document.getElementById('draw-area'); canvas.width = area.clientWidth; canvas.height = area.clientHeight;
  drawCtx = canvas.getContext('2d'); drawCtx.lineCap = 'round'; drawCtx.lineJoin = 'round'; drawCtx.lineWidth = 6;
  drawCtx.fillStyle = '#FFFFFF'; drawCtx.fillRect(0, 0, canvas.width, canvas.height); saveDrawState();
  canvas.addEventListener('pointerdown', (e) => { drawing = true; drawCtx.beginPath(); drawCtx.moveTo(e.offsetX, e.offsetY); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!drawing) return; drawCtx.strokeStyle = drawColor; drawCtx.lineTo(e.offsetX, e.offsetY); drawCtx.stroke(); });
  canvas.addEventListener('pointerup', () => { if (!drawing) return; drawing = false; drawCtx.closePath(); saveDrawState(); updateDrawUndo(); });
  buildDrawPalette();
}
function buildDrawPalette() {
  document.getElementById('draw-palette').innerHTML = drawPalette.map(c => '<div class="draw-swatch'+(c===drawColor?' active':'')+'" style="background:'+c+';" data-color="'+c+'" onclick="pickDrawColor(\''+c+'\',this)"></div>').join('');
}
function pickDrawColor(color, el) { drawColor = color; document.querySelectorAll('#draw-palette .draw-swatch').forEach(s => s.classList.remove('active')); el.classList.add('active'); }
function saveDrawState() { const c = document.getElementById('draw-canvas'); drawHistory.push(c.toDataURL()); if (drawHistory.length>30) drawHistory.shift(); }
function drawUndo() { if (drawHistory.length<=1) return; drawHistory.pop(); const c = document.getElementById('draw-canvas'), img = new Image(); img.onload = () => { drawCtx.clearRect(0,0,c.width,c.height); drawCtx.drawImage(img,0,0); updateDrawUndo(); }; img.src = drawHistory[drawHistory.length-1]; }
function updateDrawUndo() { document.getElementById('draw-undo').disabled = drawHistory.length<=1; }
function confirmClearDraw() {
  document.getElementById('confirm-modal').querySelector('.cd-title').textContent = '确定清空画布？';
  document.getElementById('confirm-modal').querySelector('.cd-desc').textContent = '清空后无法恢复哦~';
  document.getElementById('btn-confirm-action').textContent = '清空';
  document.getElementById('btn-confirm-action').onclick = () => { closeConfirm(); const c = document.getElementById('draw-canvas'); drawCtx.fillStyle='#FFFFFF'; drawCtx.fillRect(0,0,c.width,c.height); drawHistory=[]; saveDrawState(); updateDrawUndo(); showToast('画布已清空~'); };
  document.getElementById('confirm-modal').classList.add('show');
}
function confirmBackDraw() {
  if (drawHistory.length>1) {
    document.getElementById('confirm-modal').querySelector('.cd-title').textContent = '要退出吗？';
    document.getElementById('confirm-modal').querySelector('.cd-desc').textContent = '退出后未保存的内容会丢失哦~';
    document.getElementById('btn-confirm-action').textContent = '退出';
    document.getElementById('btn-confirm-action').onclick = () => { closeConfirm(); showPage('pg-outline'); };
    document.getElementById('confirm-modal').classList.add('show');
  } else showPage('pg-outline');
}

// ---- Swipe ----
let touchStartX = 0;
document.addEventListener('DOMContentLoaded', () => {
  const area = document.getElementById('canvas-area');
  if (area) { area.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; }, {passive:true});
    area.addEventListener('touchend', (e) => { const dx = e.changedTouches[0].clientX - touchStartX; if (Math.abs(dx)>50) { if (dx<0&&currentMode==='color') switchMode('deco'); else if (dx>0&&currentMode==='deco') switchMode('color'); } }); }
});

function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }
</script>
